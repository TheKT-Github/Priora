# ===================================================================
# Priora Spring Boot Application Configuration
# ===================================================================
spring.application.name=gravity-canvas-backend
server.port=8081

# Default active profile is 'dev' for zero-setup local execution (H2 in-memory)
spring.profiles.active=dev

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# SpringDoc OpenAPI / Swagger UI Endpoints
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Development Demo Data Seeder (disabled by default; enabled only in dev profile)
priora.demo-data.enabled=false
