# ===================================================================
# Priora Test Profile (Fast In-Memory Testing)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:prioratest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway Database Migration
spring.flyway.enabled=true

# Hibernate Schema Validation (Flyway executes migrations first, Hibernate validates)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.springframework=WARN
logging.level.com.gravitycanvas=WARN
logging.level.org.flywaydb=WARN

# Development Demo Data Seeder (strictly disabled in test profile)
priora.demo-data.enabled=false
