# ===================================================================
# Priora Production Profile (PostgreSQL Database)
# ===================================================================
# Driven by environment variables with secure defaults.
# Real credentials must NEVER be checked into source control.
# ===================================================================

# PostgreSQL Database Connection (Mandatory environment variables — fails fast if absent)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Console explicitly disabled in production
spring.h2.console.enabled=false

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.pool-name=PrioraProdHikariPool

# Flyway Database Migration in Production
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# JPA / Hibernate Properties (Strict schema validation in production — no auto-ddl modification)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Swagger / OpenAPI Production Security (Disabled by default)
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_API_DOCS_ENABLED:false}

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.gravitycanvas=INFO
logging.level.org.flywaydb=INFO

# Development Demo Data Seeder (strictly disabled in production)
priora.demo-data.enabled=false
