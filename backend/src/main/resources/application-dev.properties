# ===================================================================
# Priora Development Profile (Local H2 In-Memory)
# ===================================================================
# Out-of-the-box local development - no external DB installation required.
# Schema is created via Flyway migrations, then validated by Hibernate.
# Data resets on application restart.
# ===================================================================

# H2 In-Memory Database Connection (PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:prioradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Flyway Database Migration
spring.flyway.enabled=true

# JPA / Hibernate Properties (Strict schema validation - Flyway manages schema DDL)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.gravitycanvas=DEBUG
logging.level.org.flywaydb=INFO

# Development Demo Data Seeder (enabled for local H2 development)
priora.demo-data.enabled=true
